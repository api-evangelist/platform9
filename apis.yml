aid: platform9
name: Platform9
description: 'Platform9 is an enterprise private cloud company whose flagship Private Cloud Director
  is a full-featured VMware alternative for running virtual machines and containers on your own
  hardware. Built on a hardened OpenStack and Kubernetes foundation, it delivers high availability,
  live migration, dynamic resource rebalancing, and multi-tenancy, and exposes an OpenStack-compatible
  REST API (Keystone identity, Nova compute, Cinder block storage, Neutron networking, Glance images,
  and a Kubernetes service) together with the unified pcdctl CLI so teams can automate compute,
  storage, networking, and cluster operations programmatically at scale. Platform9 also offers Managed
  OpenStack, Managed Kubernetes, a free Community Edition, and the vJailbreak VMware migration tool.'
